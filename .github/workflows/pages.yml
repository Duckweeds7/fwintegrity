name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync version.json from release tag
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          echo "{\"version\":\"${VER}\",\"package\":\"fwintegrity\"}" > docs/version.json

      - name: Sync version.json from pyproject (push / manual)
        if: github.event_name != 'release'
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M)
          ver = m.group(1) if m else "0.0.0"
          Path("docs/version.json").write_text(
              json.dumps({"version": ver, "package": "fwintegrity"}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
